<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2048 Game</title>

    <link
        rel="stylesheet"
        href="card.css"
    >

</head>


<body>


    <!-- BACK TO ARCADE -->

    <a
        href="https://ruzrun.github.io/arcade-game/"
        class="top-button back-button"
    >
        🎮 Arcade
    </a>


    <!-- MUSIC -->

    <button
        id="musicButton"
        class="top-button music-button"
    >
        🎵 Music On
    </button>



    <!-- GAME -->

    <main class="game-container">


        <!-- TITLE -->

        <h1>
            2048 Game
        </h1>


        <p class="subtitle">
            Match, combine, and build your cards ✨
        </p>



        <!-- SCORE -->

        <div class="score-board">

            <div>
                Score
                <span id="score">0</span>
            </div>

            <div>
                Best
                <span id="bestScore">0</span>
            </div>

            <div>
                Combo
                <span id="combo">0</span>
            </div>

        </div>



        <!-- NEXT CARD -->

        <div class="next-card-section">

            <p>
                Next Card
            </p>

            <div id="nextCard">
                2
            </div>

        </div>



        <!-- GAME MESSAGE -->

        <p id="gameMessage">
            Swipe or use the arrow keys ✨
        </p>



        <!-- GAME BOARD -->

        <div
            id="gameBoard"
            aria-label="Card Combine game board"
        ></div>



        <!-- ACTIONS -->

        <div class="game-actions">

            <button
                id="restartButton"
                class="game-button"
                type="button"
            >
                Restart 🔄
            </button>

        </div>


    </main>



    <script src="card.js"></script>


</body>

</html>
